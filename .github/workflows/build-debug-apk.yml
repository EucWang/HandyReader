name: Build Debug APK

on:
  push:
    branches:
      - feat/tts-speed-control
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Licenses and Install Android Components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;36.0.0" "platforms;android-36"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.13599879"

      - name: Generate mock google-services.json for Debug
        run: |
          mkdir -p app
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "mock-handy-reader",
              "storage_bucket": "mock-handy-reader.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "com.wxn.reader"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "fakeApiKeyForDebugBuild1234567890"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        id: build_apk
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HandyReader-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create or Update GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v-debug-test
          name: "HandyReader 测试版 APK (TTS 优化)"
          body: |
            ### 📱 HandyReader 优化实测版
            - **分支**：`feat/tts-speed-control`
            - **优化项**：
              - 0.8x / 0.9x / 1.0x / 1.2x 快捷倍速
              - 0.01 精度平滑加减微调
              - DataStore 即时持久化，修复退后台/杀进程后倍速回退
              - 修复底层引擎未就绪时倍速设置失效
          files: app/build/outputs/apk/debug/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
